<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will you be my Valentine's?</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #ffeaf0 0%, #ffd4e5 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            touch-action: manipulation;
        }
        
        .container {
            text-align: center;
            max-width: 600px;
        }
        
        h1 {
            color: #e91e63;
            font-weight: bold;
            margin-bottom: 2rem;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 1.8rem;
                margin-bottom: 1.5rem;
            }
        }
        
        #bear-image {
            max-width: 100%;
            height: auto;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 2rem;
        }
        
        .button-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            position: relative;
            min-height: 100px;
            margin: 0 auto;
        }
        
        #yes-btn {
            font-size: 1.5rem;
            padding: 15px 60px;
            background-color: #007bff;
            border: none;
            color: white;
            font-weight: bold;
            transition: transform 0.2s;
            position: relative;
        }
        
        @media (max-width: 768px) {
            #yes-btn {
                font-size: 1.2rem;
                padding: 12px 40px;
            }
        }
        
        #yes-btn:hover {
            transform: scale(1.1);
            background-color: #0056b3;
        }
        
        #no-btn {
            font-size: 1rem;
            padding: 10px 30px;
            background-color: #007bff;
            border: none;
            color: white;
            font-weight: bold;
            position: relative;
            transition: all 0.1s ease;
        }
        
        @media (max-width: 768px) {
            #no-btn {
                font-size: 0.9rem;
                padding: 8px 25px;
            }
        }
        
        #no-btn:hover {
            background-color: #0056b3;
        }
        
        .celebration {
            display: none;
            color: #e91e63;
            font-size: 1.5rem;
            font-weight: bold;
            margin-top: 1rem;
            animation: bounce 1s infinite;
        }
        
        .side-eye-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .side-eye-overlay img {
            max-width: 80%;
            max-height: 60%;
            border-radius: 20px;
            margin-bottom: 2rem;
        }
        
        .side-eye-overlay p {
            color: white;
            font-size: 2rem;
            font-weight: bold;
            text-align: center;
            padding: 0 2rem;
        }
        
        @media (max-width: 768px) {
            .side-eye-overlay p {
                font-size: 1.3rem;
                padding: 0 1rem;
            }
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>
    <div class="side-eye-overlay" id="side-eye-overlay">
        <img src="ressources/side_eye.jpg" alt="Side Eye Dog">
        <p>Warum hast du bis jetzt noch nicht auf ja gedrückt?</p>
    </div>
    
    <div class="container">
        <h1>Will you be my Valentine's?</h1>
        
        <img id="bear-image" src="ressources/ice_bear_flowers.jpg" alt="Ice Bear with Flower">
        
        <div class="button-container">
            <button id="yes-btn" class="btn">JA NATÜRLICH</button>
            <button id="no-btn" class="btn">no</button>
        </div>
        
        <div id="celebration" class="celebration">
            JUHUUUUUU!!!!! Jetzt bin ich happy 🥰🥰🥰🥰🥰🥰
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('no-btn');
        const yesBtn = document.getElementById('yes-btn');
        const bearImage = document.getElementById('bear-image');
        const celebration = document.getElementById('celebration');
        const buttonContainer = document.querySelector('.button-container');
        const sideEyeOverlay = document.getElementById('side-eye-overlay');

        let sideEyeTimer = setTimeout(function() {
            sideEyeOverlay.style.display = 'flex';
            
            setTimeout(function() {
                sideEyeOverlay.style.display = 'none';
            }, 5000);
        }, 30000);

        let isFirstMove = true;

        function moveButtonAway(clientX, clientY) {
            const btnRect = noBtn.getBoundingClientRect();
            const mouseX = clientX;
            const mouseY = clientY;
            
            const btnCenterX = btnRect.left + btnRect.width / 2;
            const btnCenterY = btnRect.top + btnRect.height / 2;
            const distance = Math.sqrt(Math.pow(mouseX - btnCenterX, 2) + Math.pow(mouseY - btnCenterY, 2));
            
            if (distance < 150) {
                const containerRect = buttonContainer.getBoundingClientRect();
                
                if (isFirstMove) {
                    noBtn.style.position = 'absolute';
                    noBtn.style.left = (btnRect.left - containerRect.left) + 'px';
                    noBtn.style.top = (btnRect.top - containerRect.top) + 'px';
                    isFirstMove = false;
                }
                
                let currentX = parseFloat(noBtn.style.left) || 0;
                let currentY = parseFloat(noBtn.style.top) || 0;
                
                let newX = Math.random() * 400 - 200 + currentX;
                let newY = Math.random() * 200 - 100 + currentY;
                
                const viewportWidth = window.innerWidth;
                const viewportHeight = window.innerHeight;
                const btnWidth = btnRect.width;
                const btnHeight = btnRect.height;
                
                const newViewportX = containerRect.left + newX;
                const newViewportY = containerRect.top + newY;
                
                const padding = 10;
                if (newViewportX < padding) {
                    newX = padding - containerRect.left;
                } else if (newViewportX + btnWidth > viewportWidth - padding) {
                    newX = viewportWidth - padding - btnWidth - containerRect.left;
                }
                
                if (newViewportY < padding) {
                    newY = padding - containerRect.top;
                } else if (newViewportY + btnHeight > viewportHeight - padding) {
                    newY = viewportHeight - padding - btnHeight - containerRect.top;
                }
                
                noBtn.style.left = newX + 'px';
                noBtn.style.top = newY + 'px';
            }
        }

        document.addEventListener('mousemove', function(e) {
            moveButtonAway(e.clientX, e.clientY);
        });

        document.addEventListener('touchmove', function(e) {
            if (e.touches.length > 0) {
                moveButtonAway(e.touches[0].clientX, e.touches[0].clientY);
            }
        });

        noBtn.addEventListener('mouseenter', function(e) {
            handleButtonInteraction();
        });

        noBtn.addEventListener('touchstart', function(e) {
            e.preventDefault();
            handleButtonInteraction();
        });

        function handleButtonInteraction() {
            if (isFirstMove) {
                const btnRect = noBtn.getBoundingClientRect();
                const containerRect = buttonContainer.getBoundingClientRect();
                
                noBtn.style.position = 'absolute';
                noBtn.style.left = (btnRect.left - containerRect.left) + 'px';
                noBtn.style.top = (btnRect.top - containerRect.top) + 'px';
                
                isFirstMove = false;
            }
            
            const containerRect = buttonContainer.getBoundingClientRect();
            const btnRect = noBtn.getBoundingClientRect();
            
            let currentX = parseFloat(noBtn.style.left) || 0;
            let currentY = parseFloat(noBtn.style.top) || 0;
            
            let newX = Math.random() * 400 - 200 + currentX;
            let newY = Math.random() * 200 - 100 + currentY;
            
            const viewportWidth = window.innerWidth;
            const viewportHeight = window.innerHeight;
            const btnWidth = btnRect.width;
            const btnHeight = btnRect.height;
            
            const newViewportX = containerRect.left + newX;
            const newViewportY = containerRect.top + newY;
            
            const padding = 10;
            if (newViewportX < padding) {
                newX = padding - containerRect.left;
            } else if (newViewportX + btnWidth > viewportWidth - padding) {
                newX = viewportWidth - padding - btnWidth - containerRect.left;
            }
            
            if (newViewportY < padding) {
                newY = padding - containerRect.top;
            } else if (newViewportY + btnHeight > viewportHeight - padding) {
                newY = viewportHeight - padding - btnHeight - containerRect.top;
            }
            
            noBtn.style.left = newX + 'px';
            noBtn.style.top = newY + 'px';
        }

        yesBtn.addEventListener('click', function() {
            clearTimeout(sideEyeTimer);
            
            bearImage.src = 'ressources/happy_bear.gif';
            bearImage.alt = 'Happy Bear';
            
            yesBtn.style.display = 'none';
            noBtn.style.display = 'none';
            
            celebration.style.display = 'block';
        });
    </script>
</body>
</html>
